name: Scheduled pipeline run

# Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC), plus an on-demand
# "Run workflow" button in the Actions tab for manual testing.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Observed locally: a full 1,000-paper run takes ~71 minutes, almost
    # entirely GitHub's search-endpoint rate limit (~30 req/min) during
    # paper->repo enrichment, not this workflow's own overhead. 150min
    # gives real headroom without approaching the 360min hard cap.
    timeout-minutes: 150

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # NOTE: "GITHUB_TOKEN" is a reserved secret name in Actions (GitHub
      # auto-injects one per run) -- you cannot create a repo secret with
      # that exact name. The pipeline's own personal access token (used
      # for the 5,000/hr authenticated GitHub API budget when matching
      # papers to repos) is stored under a different secret name and
      # mapped to the GITHUB_TOKEN env var the code actually reads.
      GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON_PATH: service_account.json

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account JSON from secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 --decode > service_account.json

      - name: Run full pipeline (scrape, resolve, validate, write output/*.jsonl+csv)
        run: python -m src.pipeline.run_all

      - name: Push output to Google Sheets
        run: python -m src.output.to_sheets

      - name: Clean up service account file
        if: always()
        run: rm -f service_account.json

      - name: Upload output as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: output/
          retention-days: 14
