name: Fast pipeline (startups + jobs + news)

# Every 6 hours, plus an on-demand "Run workflow" button for manual
# testing. Only touches the Startups/Products/Jobs/News/Entity Mapping
# Log tabs -- see to_sheets.py's --only flag below. Never touches the
# Research Papers tab; that's papers_pipeline.yml's job, on its own
# slower schedule.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  run-fast-pipeline:
    runs-on: ubuntu-latest
    # Observed locally: ~1-2 minutes end to end. 20min is generous headroom.
    timeout-minutes: 20

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # "GITHUB_TOKEN" is a reserved secret name in Actions -- the
      # pipeline's own PAT (used for GitHub API calls made while
      # canonicalizing job-board company names, if any) is stored under
      # a different secret name and mapped to the env var the code reads.
      GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON_PATH: service_account.json

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account JSON from secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 --decode > service_account.json

      - name: Run fast path (startups, products, jobs, news, entity resolution)
        run: python -m src.pipeline.run_fast

      - name: Push to Sheets (Startups/Products/Jobs/News/Entity Mapping Log tabs only)
        run: python -m src.output.to_sheets --only startups,products,jobs,news,entity_mapping_log

      - name: Clean up service account file
        if: always()
        run: rm -f service_account.json

      - name: Upload output as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-pipeline-output-${{ github.run_id }}
          path: |
            output/startups.*
            output/products.*
            output/jobs.*
            output/news.*
            output/entity_mapping_log.*
          retention-days: 14
