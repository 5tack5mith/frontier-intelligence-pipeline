name: Papers pipeline (research papers only)

# Every 2 days at 00:00 UTC, plus an on-demand "Run workflow" button.
#
# Cron caveat (documented, not hidden): standard cron has no native
# concept of a rolling "every N days" interval -- day-of-month step
# values (*/2) restart at day 1 every month rather than counting
# continuously from the last run. "0 0 */2 * *" fires on odd
# days-of-month (1,3,5,...): this is correct in 30-day months and
# non-leap Februaries, but produces a 1-day gap instead of 2 at the
# boundary of every 31-day month and leap-year February (~7-8
# times/year total), since e.g. day 31 and the next day 1 are both
# "odd". This is the standard idiom for "every 2 days" in cron and the
# drift is a data-freshness nicety, not a correctness bug -- research
# papers still refresh at least every 2 days, occasionally 1 day early.
# A perfectly precise rolling interval would require a stateful
# skip-check (e.g. reading the last successful run's timestamp) rather
# than relying on cron's day-of-month field alone.
on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch: {}

jobs:
  run-papers-pipeline:
    runs-on: ubuntu-latest
    # Observed locally: a full 1,000-paper run takes ~71 minutes, almost
    # entirely GitHub's search-endpoint rate limit (~30 req/min) during
    # paper->repo enrichment. 150min gives headroom short of the 360min cap.
    timeout-minutes: 150

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON_PATH: service_account.json

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account JSON from secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 --decode > service_account.json

      - name: Run papers path (arXiv + GitHub enrichment only)
        run: python -m src.pipeline.run_papers

      - name: Push to Sheets (Research Papers tab only)
        run: python -m src.output.to_sheets --only research_papers

      - name: Clean up service account file
        if: always()
        run: rm -f service_account.json

      - name: Upload output as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papers-pipeline-output-${{ github.run_id }}
          path: |
            output/research_papers.*
          retention-days: 14
